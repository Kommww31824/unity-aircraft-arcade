<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>飞机射击</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#e9f1fc;font:16px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:18px}h1{font-size:21px;margin:0 0 8px}p{margin:0 0 12px;color:#c0cfe0}canvas{display:block;margin:auto;background:#070b10;width:auto;height:auto;max-width:100%;max-height:78vh;outline:none}button{font:inherit;padding:6px 12px;cursor:pointer}#status{margin:8px 0}
</style></head>
<body><main><h1>飞机射击</h1><p>方向键或 WASD 移动，鼠标左键射击。</p><button id="full" hidden>全屏</button><p id="status" role="status">正在加载试玩版…</p><canvas id="game" width="960" height="600" tabindex="0"></canvas></main>
<script type="application/json" id="chunks">{"Build/arcade.data.unityweb":["Build/arcade.data.unityweb.part00","Build/arcade.data.unityweb.part01","Build/arcade.data.unityweb.part02","Build/arcade.data.unityweb.part03","Build/arcade.data.unityweb.part04","Build/arcade.data.unityweb.part05","Build/arcade.data.unityweb.part06"],"Build/arcade.wasm.unityweb":["Build/arcade.wasm.unityweb.part00","Build/arcade.wasm.unityweb.part01","Build/arcade.wasm.unityweb.part02","Build/arcade.wasm.unityweb.part03","Build/arcade.wasm.unityweb.part04","Build/arcade.wasm.unityweb.part05","Build/arcade.wasm.unityweb.part06"]}</script><script src="Build/arcade.loader.js"></script>
<script>
const canvas=document.getElementById('game'),status=document.getElementById('status'),full=document.getElementById('full');
const config={dataUrl:"Build/arcade.data.unityweb",frameworkUrl:"Build/arcade.framework.js.unityweb",codeUrl:"Build/arcade.wasm.unityweb",streamingAssetsUrl:"StreamingAssets",companyName:"DefaultCompany",productName:"My project_xnxs",productVersion:"0.1"};
if(typeof createUnityInstance!=="function"){status.textContent="加载脚本失败，请刷新页面重试。";}
else (async()=>{
 const parts=JSON.parse(document.getElementById('chunks').textContent);
 for(const key of ['dataUrl','codeUrl','frameworkUrl']){
   const list=parts[config[key]];
   if(!list) continue;
   const blocks=await Promise.all(list.map(async url=>{
     const response=await fetch(url);
     if(!response.ok) throw new Error('HTTP '+response.status+' '+url);
     return response.arrayBuffer();
   }));
   config[key]=URL.createObjectURL(new Blob(blocks));
 }
 return createUnityInstance(canvas,config,p=>{status.textContent="正在加载试玩版… "+Math.round(p*100)+"%";});
})().then(game=>{status.textContent="加载完成 · 点击游戏画面开始";full.hidden=false;full.onclick=()=>game.SetFullscreen(1);canvas.addEventListener('pointerdown',()=>canvas.focus());}).catch(error=>{status.textContent="加载失败："+error;console.error(error);});
</script></body></html>
